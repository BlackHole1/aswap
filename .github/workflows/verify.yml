name: verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, patches, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@v5
      - name: Install script tooling
        run: bun install --frozen-lockfile
      - name: Lint (oxlint)
        run: bun run lint
      - name: Check formatting (oxfmt)
        run: bun run format
      - name: Typecheck scripts
        run: bun run typecheck
      - name: Patches apply cleanly
        run: bun run patches verify
      - name: Apply the series
        run: bun run patches apply
      - name: Exported patches match the applied commits
        run: bun run patches export --check
      - name: Upstream test suite on the patched tree
        run: bun run test
      - name: Build the wheel
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The patches touch platform branches (Claude Desktop, Chrome, process
  # lookup) that only run on macOS or Windows, so the suite runs there too.
  # Lint, export and build are platform-independent and stay in the job above.
  test:
    name: Tests on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # The runner checks out with core.autocrlf=true, which would turn the
      # .patch files and the upstream clone into CRLF and break git am.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@v5
      - name: Apply the series
        run: bun run patches apply
      - name: Upstream test suite on the patched tree
        run: bun run test
